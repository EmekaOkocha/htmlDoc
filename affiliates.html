    <style>
        /* Custom Styles and Color Scheme (Professional & Attractive: Deep Navy/Vibrant Orange) */
        :root {
            --color-primary: #F97316; /* Orange 600 - Primary Accent */
            --color-secondary: #3B82F6; /* Blue 500 - Secondary Blue for contrast */
            --color-dark: #0B1229; /* Deep Navy/Midnight Blue for dark background */
            --color-text: #E5E7EB; /* Gray 200 for light text */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-dark);
            color: var(--color-text);
            scroll-behavior: smooth;
        }
        .header-bg {
            background-color: var(--color-dark);
        }
        .text-primary { color: var(--color-primary); }
        .bg-primary { background-color: var(--color-primary); }
        .text-secondary { color: var(--color-secondary); }

        .btn-main {
            background-color: var(--color-primary);
            color: var(--color-dark);
            transition: background-color 0.3s;
        }
        .btn-main:hover {
            background-color: #C2410C; /* Orange 700 - Darker orange hover */
        }
    </style>
</head>
